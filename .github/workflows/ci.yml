name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q paicli tests
      - name: Unit and local integration tests
        run: python -m unittest discover -s tests -q
      - name: Editable install smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          paicli --help >/dev/null
          paicli-eval --help >/dev/null
      - name: Ensure real-provider tests remain opt-in
        run: |
          test "${PAICLI_RUN_DASHSCOPE_LIVE_TEST:-0}" = "0"
          test "${PAICLI_RUN_VLLM_LIVE_TEST:-0}" = "0"
