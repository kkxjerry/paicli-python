[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicli-python-phase1"
version = "0.1.0"
description = "A minimal Phase 1 ReAct coding agent for learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paicli = "paicli.__main__:main"

[tool.setuptools.packages.find]
include = ["paicli*"]

