[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicli-python"
version = "0.22.0"
description = "A 22-phase Python coding-agent learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paicli = "paicli.__main__:main"

[tool.setuptools.packages.find]
include = ["paicli*"]
