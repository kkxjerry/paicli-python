[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicli-python"
version = "1.1.1"
description = "A local ReAct, Plan, and Team coding-agent harness"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paicli = "paicli.__main__:main"
paicli-eval = "paicli.evaluation:main"

[tool.setuptools.packages.find]
include = ["paicli*"]
